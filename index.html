<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irregular Verbs — Past Simple Quest</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#242344;background:#f5f4ff}
*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:850px;margin:auto}
.hero{background:linear-gradient(125deg,#27265e,#6553b7);color:white;padding:24px;border-radius:20px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 8px}.hero p{margin:0;color:#e8e4ff}
.stats,.nav,.actions,.options{display:flex;gap:8px;flex-wrap:wrap}.stats{margin-top:16px}.pill{background:#ffffff24;padding:7px 11px;border-radius:10px;font-size:13px}
.nav{margin:16px 0}.nav button{flex:1;min-width:100px;font-size:13px}
button{cursor:pointer;border:1px solid #dedbed;background:white;color:#292744;border-radius:11px;padding:11px 14px;font:inherit}
button:hover{border-color:#8374d9}button:disabled{opacity:.45;cursor:not-allowed}.active,.primary{background:#6553b7;color:white;border-color:#6553b7}
.panel{background:white;border:1px solid #e2def1;border-radius:16px;padding:20px;box-shadow:0 5px 20px #28215b0a}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#7765ce}
h2{font-size:22px;margin:7px 0}p{line-height:1.55}.muted{color:#706e86}.small{font-size:12px}
.progress{height:7px;background:#eeeafa;border-radius:99px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#8170e5}
.flash{width:100%;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;background:#f7f5ff;border:2px dashed #8b7cf6;border-radius:15px;margin:15px 0}
.base{font-size:36px;font-weight:850}.past{font-size:27px;font-weight:750;color:#6553b7}.meaning{font-size:14px;color:#706e86}
.actions button{flex:1}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:15px 0}.options button{text-align:left;min-height:48px}
.correct{background:#e1f7e9!important;border-color:#299b6b!important;color:#155c38!important}.wrong{background:#ffeded!important;border-color:#df6565!important;color:#8d2222!important}
.feedback{min-height:26px;margin:10px 0;font-weight:650}.good{color:#208353}.bad{color:#c64c4c}
.inputrow{display:flex;gap:8px;margin:14px 0}.inputrow input{min-width:0;flex:1;padding:12px;border:1px solid #dedbed;border-radius:10px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}.grid button{padding:12px 3px;overflow-wrap:anywhere;font-size:14px;font-weight:700;min-height:50px}
.matched{opacity:.5;border-color:#299b6b}.sentence{padding:16px;border-radius:12px;background:#f7f5ff;line-height:1.8;font-size:17px;margin:12px 0}
table{width:100%;border-collapse:collapse;margin-top:12px}td,th{text-align:left;padding:9px 7px;border-bottom:1px solid #e7e3f0}th{font-size:12px;color:#706e86}
@media(max-width:480px){body{padding:10px}.panel{padding:14px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:18px}.options{grid-template-columns:1fr}}
</style>
</head>
<body><main class="app" id="app">
<header class="hero"><div style="font-size:12px;font-weight:800;letter-spacing:1.4px;margin-bottom:10px">ENGLISH · LEVEL A1–A2</div><h1>Irregular Verbs<br>Past Simple Quest 🎯</h1><p>Remember the forms. Beat the games. Use them in real sentences!</p><div class="stats"><span class="pill">📚 20 verbs</span><span class="pill">⭐ <b id="score">0</b> points</span><span class="pill">🏆 Best streak: <b id="best">0</b></span></div></header>
<nav class="nav" aria-label="Lesson activities"><button class="active" data-tab="learn">1. Learn</button><button data-tab="quiz">2. Quiz</button><button data-tab="spell">3. Spell it</button><button data-tab="match">4. Match</button><button data-tab="story">5. Story</button><button data-tab="review">Verb list</button></nav>
<section id="content" aria-live="polite"></section>
</main>
<script>
(()=>{
const verbs=[['be','was / were','бути'],['become','became','ставати'],['begin','began','починати'],['break','broke','ламати'],['bring','brought','приносити'],['build','built','будувати'],['buy','bought','купувати'],['catch','caught','ловити'],['choose','chose','обирати'],['come','came','приходити'],['do','did','робити'],['drink','drank','пити'],['drive','drove','керувати автомобілем'],['eat','ate','їсти'],['fall','fell','падати'],['feel','felt','відчувати'],['find','found','знаходити'],['fly','flew','літати'],['forget','forgot','забувати'],['get','got','отримувати']];
const stories=[
['Yesterday, I ___ my homework before dinner.','did','do',['did','done','do'],'do → did'],
['Last weekend, we ___ a new board game.','bought','buy',['buyed','bought','brought'],'buy → bought'],
['My little brother ___ off his bike yesterday.','fell','fall',['felt','fallen','fell'],'fall → fell'],
['I was thirsty, so I ___ some water.','drank','drink',['drunk','drank','drinked'],'drink → drank'],
['They ___ a beautiful sandcastle on the beach.','built','build',['builded','built','bought'],'build → built'],
['She ___ her keys under the sofa.','found','find',['finded','felt','found'],'find → found'],
['He ___ very happy about his birthday present.','felt','feel',['fell','felt','feel'],'feel → felt'],
['We ___ home late after the party.','came','come',['comed','came','come'],'come → came'],
['I ___ my umbrella on the bus.','forgot','forget',['forgot','forgetted','forgotten'],'forget → forgot'],
['The film ___ at seven o’clock.','began','begin',['began','begun','beginned'],'begin → began']
];
let score=0,streak=0,best=0,tab='learn',idx=0,revealed=false,order=[],qi=0,qright=0,answered=false,si=0,spellOrder=[],matchCards=[],selected=null,matched=new Set(),shown=new Set(),attempts=0,matchBusy=false,storyIdx=0,storyRight=0;
const $=id=>document.getElementById(id), content=$('content');
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function points(n){score+=n;streak++;best=Math.max(best,streak);stats()}
function miss(){streak=0;stats()}
function stats(){$('score').textContent=score;$('best').textContent=best}
function frame(html){content.innerHTML=html;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function learn(){const v=verbs[idx];frame(`<div class="panel"><div class="eyebrow">Stage 1 · Remember</div><h2>Flashcard laboratory 🧠</h2><p class="muted">Look at the base verb. Say the Past Simple form aloud before revealing it. For <b>be</b>, remember both forms: <b>was / were</b>.</p><div class="progress"><div style="width:${(idx+1)/verbs.length*100}%"></div></div><div class="small muted">CARD ${idx+1} OF ${verbs.length}</div><button class="flash" id="flip"><span class="base">${esc(v[0])}</span>${revealed?`<span class="past">${esc(v[1])}</span><span class="meaning">${esc(v[2])}</span>`:'<span class="muted">Think first… then tap to reveal 👻</span>'}</button><div class="actions"><button id="prev" ${idx===0?'disabled':''}>← Previous</button><button class="primary" id="reveal">${revealed?'Hide answer':'Reveal answer'}</button><button id="next">${idx===19?'Restart cards':'Next →'}</button></div><p class="muted small">Memory trick: say the pair three times — <i>bring, brought, brought</i> — then cover the answer and recall it again.</p></div>`);$('flip').onclick=$('reveal').onclick=()=>{revealed=!revealed;learn()};$('prev').onclick=()=>{idx=Math.max(0,idx-1);revealed=false;learn()};$('next').onclick=()=>{idx=idx===19?0:idx+1;revealed=false;learn()}}
function startQuiz(){order=shuffle(verbs.map((v,i)=>i));qi=0;qright=0;answered=false;quiz()}
function quiz(){if(qi>=20){frame(`<div class="panel"><div class="eyebrow">Stage 2 · Recognition</div><h2>${qright>=16?'Fantastic work! 🏆':qright>=12?'Great progress! 🌟':'Keep training! 💪'}</h2><p>You scored <b>${qright}/20</b>.</p><div class="progress"><div style="width:${qright/20*100}%"></div></div><p class="muted">Repeat the quiz until you can choose the correct form without guessing.</p><button class="primary" id="again">Play quiz again</button> <button id="nextstage">Try spelling →</button></div>`);$('again').onclick=startQuiz;$('nextstage').onclick=()=>open('spell');return}
const v=verbs[order[qi]],opts=shuffle([v[1],...shuffle(verbs.filter(x=>x[1]!==v[1]).map(x=>x[1])).slice(0,3)]);frame(`<div class="panel"><div class="eyebrow">Stage 2 · Choose the correct form</div><span class="pill">Question ${qi+1}/20</span><div class="progress"><div style="width:${qi/20*100}%"></div></div><h2>What is the Past Simple of…</h2><div style="font-size:38px;font-weight:850;text-align:center;padding:18px">${esc(v[0])}</div><div class="options">${opts.map((o,i)=>`<button data-answer="${esc(o)}">${String.fromCharCode(65+i)}. &nbsp; ${esc(o)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="primary" id="continue" disabled style="width:100%">${qi===19?'See results':'Next question →'}</button></div>`);
content.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=b.dataset.answer===v[1];if(ok){qright++;points(10);b.classList.add('correct');$('feedback').innerHTML='<span class="good">✓ Correct! +10 points</span>'}else{miss();b.classList.add('wrong');content.querySelectorAll('[data-answer]').forEach(x=>{if(x.dataset.answer===v[1])x.classList.add('correct')});$('feedback').innerHTML=`<span class="bad">Not quite.</span> The answer is <b>${esc(v[1])}</b>. Say the pair aloud.`}content.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);$('continue').disabled=false});$('continue').onclick=()=>{qi++;answered=false;quiz()}}
function startSpell(){spellOrder=shuffle(verbs.map((v,i)=>i));si=0;spell()}
function spell(){if(si>=20){frame(`<div class="panel"><div class="eyebrow">Stage 3 · Recall</div><h2>Spelling challenge complete! ✍️</h2><p>You practised all 20 verbs without seeing the answers first.</p><p class="muted">Repeat the difficult ones tomorrow. The goal is to recall the form, not just recognise it.</p><button class="primary" id="spellagain">Try again</button> <button id="matchnext">Play matching →</button></div>`);$('spellagain').onclick=startSpell;$('matchnext').onclick=()=>open('match');return}
const v=verbs[spellOrder[si]];frame(`<div class="panel"><div class="eyebrow">Stage 3 · Type from memory</div><span class="pill">Word ${si+1}/20</span><div class="progress"><div style="width:${si/20*100}%"></div></div><h2>Write the Past Simple form</h2><div style="font-size:35px;font-weight:850;margin:20px 0 4px">${esc(v[0])}</div><p class="muted">Say it aloud first. For <b>be</b>, type <b>was / were</b>.</p><form id="spellform" class="inputrow"><input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type the past form…" required><button class="primary">Check</button></form><div id="spellfeedback" class="feedback"></div><button id="spellnext" class="primary" style="width:100%;display:none">Next verb →</button></div>`);$('spellform').onsubmit=e=>{e.preventDefault();const a=$('answer').value.trim().toLowerCase().replace(/\s+/g,' '),correct=v[0]==='be'?['was / were','was/were','was or were','was, were']: [v[1].toLowerCase()];const ok=correct.includes(a);$('spellfeedback').innerHTML=ok?'<span class="good">✓ Perfect! +10 points</span>':`<span class="bad">Correct form: <b>${esc(v[1])}</b>.</span> Say it three times, then continue.`;if(ok)points(10);else miss();$('answer').disabled=true;$('spellform').querySelector('button').disabled=true;$('spellnext').style.display='block'};$('spellnext').onclick=()=>{si++;spell()}}
function startMatch(){const chosen=shuffle(verbs.map((v,i)=>i)).slice(0,8);matchCards=shuffle(chosen.flatMap(i=>[{key:i,kind:'base',text:verbs[i][0]},{key:i,kind:'past',text:verbs[i][1]}]));selected=null;matched=new Set();shown=new Set();attempts=0;matchBusy=false;match()}
function match(){frame(`<div class="panel"><div class="eyebrow">Stage 4 · Memory match</div><h2>Find the matching pairs 🧩</h2><p class="muted">Match each base verb with its Past Simple form. Choose two cards. There are 8 pairs.</p><span class="pill">Pairs: ${matched.size}/8</span> <span class="pill">Attempts: ${attempts}</span><div class="grid">${matchCards.map((c,i)=>`<button data-card="${i}" ${matched.has(c.key)?'class="matched"':''}>${matched.has(c.key)?'✓ '+esc(c.text):shown.has(i)?esc(c.text):'❔'}</button>`).join('')}</div><div class="feedback" id="matchfeedback">${matched.size===8?'<span class="good">You found every pair! 🎉</span>':'Choose two cards.'}</div><button id="resetmatch">Shuffle and play again</button> <button id="storynext">Go to story →</button></div>`);content.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>chooseCard(Number(b.dataset.card)));$('resetmatch').onclick=startMatch;$('storynext').onclick=()=>open('story')}
function chooseCard(i){if(matchBusy||matched.has(matchCards[i].key)||shown.has(i))return;shown.add(i);attempts++;const b=content.querySelector(`[data-card="${i}"]`);if(b)b.textContent=matchCards[i].text;if(selected===null){selected=i;return}const a=matchCards[selected],c=matchCards[i];if(a.key===c.key&&a.kind!==c.kind){matched.add(a.key);points(10);selected=null;if(matched.size===8){score+=30;stats()}match();return}miss();matchBusy=true;const old=selected;selected=null;$('matchfeedback').textContent='Not a pair — remember where the cards are!';setTimeout(()=>{shown.delete(old);shown.delete(i);matchBusy=false;match()},850)}
function story(){if(storyIdx>=stories.length){frame(`<div class="panel"><div class="eyebrow">Stage 5 · Real-life English</div><h2>Story mission complete! 🎉</h2><p>You got <b>${storyRight}/10</b> sentences correct on the first try.</p><p class="muted">Read the full sentences aloud. Then invent three sentences about your own life using different irregular verbs.</p><button class="primary" id="storyagain">Play story again</button> <button id="reviewnext">Review all verbs →</button></div>`);$('storyagain').onclick=()=>{storyIdx=0;storyRight=0;story()};$('reviewnext').onclick=()=>open('review');return}
const s=stories[storyIdx],parts=s[0].split('___');frame(`<div class="panel"><div class="eyebrow">Stage 5 · Past Simple story</div><span class="pill">Sentence ${storyIdx+1}/10</span><div class="progress"><div style="width:${storyIdx/10*100}%"></div></div><h2>Complete the story</h2><div class="sentence">${esc(parts[0])}<b style="color:#6553b7"> _____ </b>${esc(parts[1])}</div><p class="muted">Choose the correct irregular verb form.</p><div class="options">${shuffle(s[3]).map(o=>`<button data-story="${esc(o)}">${esc(o)}</button>`).join('')}</div><div class="feedback" id="storyfeedback"></div><button class="primary" id="storycontinue" style="width:100%;display:none">Next sentence →</button></div>`);let done=false;content.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=b.dataset.story===s[1];if(ok){storyRight++;points(10);b.classList.add('correct');$('storyfeedback').innerHTML='<span class="good">Correct! +10 points</span>'}else{miss();b.classList.add('wrong');content.querySelectorAll('[data-story]').forEach(x=>{if(x.dataset.story===s[1])x.classList.add('correct')});$('storyfeedback').innerHTML=`The answer is <b>${esc(s[1])}</b> (${esc(s[4])}). Say the whole sentence aloud.`}content.querySelectorAll('[data-story]').forEach(x=>x.disabled=true);$('storycontinue').style.display='block'});$('storycontinue').onclick=()=>{storyIdx++;story()}}
function review(){frame(`<div class="panel"><div class="eyebrow">Quick reference</div><h2>All 20 irregular verbs</h2><p class="muted">Cover the Past Simple column and test yourself. The past form stays the same with I, you, he, she, it, we and they.</p><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Base form</th><th>Past Simple</th><th>Meaning</th></tr></thead><tbody>${verbs.map((v,i)=>`<tr><td>${i+1}</td><td><b>${esc(v[0])}</b></td><td><b>${esc(v[1])}</b></td><td>${esc(v[2])}</td></tr>`).join('')}</tbody></table></div><p class="muted small">Special reminder: <b>be → was / were</b>. Use <b>was</b> with I/he/she/it and <b>were</b> with you/we/they.</p><button class="primary" id="reviewquiz">Test my memory →</button></div>`);$('reviewquiz').onclick=()=>open('quiz')}
function open(t){tab=t;if(t==='learn')learn();if(t==='quiz')startQuiz();if(t==='spell')startSpell();if(t==='match')startMatch();if(t==='story'){storyIdx=0;storyRight=0;story()}if(t==='review')review()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>open(b.dataset.tab));stats();learn();
})();
</script></body></html>
